name: TalentDesk CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talentdesk-ci-main
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Dependency audit (report only; no automatic upgrades)
        run: |
          npm audit --json > "$RUNNER_TEMP/talentdesk-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP+"/talentdesk-audit.json"); console.log("TD_AUDIT", JSON.stringify({counts:a.metadata?.vulnerabilities??null,error:a.error?.code??null,packages:Object.keys(a.vulnerabilities??{})}));'
      - name: Domain tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Lockfile transfer evidence (public dependency metadata only)
        run: |
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const b=fs.readFileSync("package-lock.json"),p=JSON.parse(b);for(const v of Object.values(p.packages)){if(v.resolved && !v.resolved.startsWith("https://registry.npmjs.org/"))throw Error("Unexpected registry");}console.log("TD_LOCK_SHA "+crypto.createHash("sha256").update(b).digest("hex"));const s=b.toString("base64");for(let i=0;i<s.length;i+=2000)console.log("TD_LOCK "+i+" "+s.slice(i,i+2000));'
      - name: Preserve resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error
      - name: Install isolated browser QA
        run: |
          npm install --prefix "$RUNNER_TEMP/talentdesk-qa" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/talentdesk-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser journey (synthetic desktop and mobile)
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/talentdesk-qa/node_modules
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node scripts/verify-browser.mjs
      - name: Save synthetic QA evidence and build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: talentdesk-demo-evidence
          path: |
            qa-output/
            dist/
          retention-days: 2
          if-no-files-found: error
